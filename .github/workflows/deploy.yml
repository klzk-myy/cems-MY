name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Write deploy env
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_APP_URL: ${{ secrets.DEPLOY_APP_URL }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          printf 'DEPLOY_HOST=%s\n' "$DEPLOY_HOST"          > ".env.deploy.${{ github.event.inputs.environment }}"
          printf 'DEPLOY_USER=%s\n' "$DEPLOY_USER"          >> ".env.deploy.${{ github.event.inputs.environment }}"
          printf 'DEPLOY_PATH=%s\n' "$DEPLOY_PATH"          >> ".env.deploy.${{ github.event.inputs.environment }}"
          printf 'DEPLOY_APP_URL=%s\n' "$DEPLOY_APP_URL"    >> ".env.deploy.${{ github.event.inputs.environment }}"
          printf 'DEPLOY_BRANCH=%s\n' "$DEPLOY_BRANCH"      >> ".env.deploy.${{ github.event.inputs.environment }}"
          printf 'SLACK_WEBHOOK_URL=%s\n' "$SLACK_WEBHOOK_URL" >> ".env.deploy.${{ github.event.inputs.environment }}"
          chmod 600 ".env.deploy.${{ github.event.inputs.environment }}"

      - name: Materialize SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
            chmod 600 "$RUNNER_TEMP/deploy_key"
            printf 'DEPLOY_SSH_KEY=%s\n' "$RUNNER_TEMP/deploy_key" >> ".env.deploy.${{ github.event.inputs.environment }}"
          fi

      - name: Deploy
        env:
          DEPLOY_ENV: ${{ github.event.inputs.environment }}
        run: bash scripts/ci/deploy.sh "$DEPLOY_ENV"

      - name: Notify failure on error
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_ENV: ${{ github.event.inputs.environment }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -fsS --connect-timeout 10 --max-time 30 -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"❌ Deploy workflow failed for $DEPLOY_ENV! Run ID: ${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL" || true
          fi
