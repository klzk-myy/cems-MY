name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, xml, tokenizer, sqlite3, gd, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run lint stage
        run: scripts/ci/lint.sh

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, xml, tokenizer
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Cache TruffleHog binary
        uses: actions/cache@v4
        with:
          path: .tmp/trufflehog
          key: trufflehog-${{ runner.os }}-3.95.9

      - name: Run security stage
        run: scripts/ci/security.sh

  test:
    name: Tests (Unit + Feature + Simulation)
    runs-on: ubuntu-latest
    needs: [lint, security]
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli -a redpass ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --requirepass redpass
        ports:
          - 6379:6379

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: "redpass"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, xml, tokenizer, sqlite3, gd, zip, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p storage/test-results

      - name: Run unit tests
        run: php artisan test --testsuite=Unit --compact 2>&1 | tee storage/test-results/unit-test-output.txt

      - name: Run feature tests
        run: php artisan test --testsuite=Feature --compact 2>&1 | tee storage/test-results/feature-test-output.txt

      - name: Run simulation smoke test
        run: php artisan test --compact tests/Http/Simulation/Support/OracleSmokeTest.php 2>&1 | tee storage/test-results/simulation-smoke-output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: storage/test-results/
          retention-days: 7
          if-no-files-found: ignore
