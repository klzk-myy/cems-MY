name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_KEY: base64:WlbBhnWV/8WIwLujIHnV4WqVBGA6jVh/6mAt4gt+NN8=
  BACKUP_NOTIFY_EMAIL: backups@example.com

jobs:
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, xml, tokenizer, sqlite3, gd, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run lint stage
        run: scripts/ci/lint.sh

  security:
    name: Security audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, xml, tokenizer
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Cache TruffleHog binary
        uses: actions/cache@v6
        with:
          path: .tmp/trufflehog
          key: trufflehog-${{ runner.os }}-3.95.9

      - name: Run security stage
        run: scripts/ci/security.sh

  test:
    name: Tests (Unit + Feature + Simulation)
    runs-on: ubuntu-22.04
    needs: [lint, security]
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: "redpass"

    steps:
      - uses: actions/checkout@v7

      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass redpass
          for i in {1..30}; do
            if docker exec redis redis-cli -a redpass ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, xml, tokenizer, sqlite3, gd, zip, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p storage/test-results

      - name: Run unit tests
        run: php artisan test --testsuite=Unit --compact 2>&1 | tee storage/test-results/unit-test-output.txt

      - name: Run feature tests
        run: php artisan test --testsuite=Feature --compact 2>&1 | tee storage/test-results/feature-test-output.txt

      - name: Run simulation smoke test
        run: php artisan test --compact tests/Http/Simulation/Support/OracleSmokeTest.php 2>&1 | tee storage/test-results/simulation-smoke-output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: storage/test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-22.04
    needs: [lint, security]
    env:
      E2E_CHANNEL: chromium
      E2E_BASE_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v7

      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass redpass
          for i in {1..30}; do
            if docker exec redis redis-cli -a redpass ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Redis failed to start"; exit 1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, xml, tokenizer, sqlite3, gd, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/e2e.sqlite
          mkdir -p storage/framework/{sessions,cache,views} storage/logs bootstrap/cache
          cat >> .env <<EOF
          APP_ENV=testing
          APP_URL=http://127.0.0.1:8080
          DB_CONNECTION=sqlite
          DB_DATABASE=/database/e2e.sqlite
          CACHE_DRIVER=array
          RATE_LIMIT_CACHE_STORE=array
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          MFA_ENABLED=true
          SECURITY_IP_BLOCKING_ENABLED=false
          BCRYPT_ROUNDS=4
          BNM_LICENSE_NUMBER=TEST-LICENSE-001
          APP_ENCRYPTION_SALT=$(openssl rand -hex 32)
          EOF
          sed -i "s|DB_DATABASE=/database/e2e.sqlite|DB_DATABASE=$PWD/database/e2e.sqlite|" .env

      - name: Seed database (schema + reference data + demo users)
        run: php artisan db:seed --force

      - name: Start application server
        run: |
          php artisan serve --host=127.0.0.1 --port=8080 --no-reload > storage/logs/e2e-serve.log 2>&1 &
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/up || true)
            if [ "$code" = "200" ]; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start (last status: $code)"
          curl -s -D - http://127.0.0.1:8080/login -o /dev/null || true
          cat storage/logs/e2e-serve.log; exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser e2e tests
        run: npm run test:e2e

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            playwright-report/
            test-results/e2e/
            storage/logs/e2e-serve.log
          retention-days: 7
          if-no-files-found: ignore
